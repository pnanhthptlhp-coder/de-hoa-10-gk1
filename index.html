<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đề kiểm tra giữa học kỳ I - Hóa học 10</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#18212f;line-height:1.5}
.wrap{max-width:1000px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#173d8f,#2e65d4);color:#fff;padding:24px;border-radius:18px}
h1{text-align:center;font-size:26px;margin:15px 0 5px}.meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.meta input{padding:10px;border:0;border-radius:8px}
.card{background:#fff;border:1px solid #d7deea;border-radius:14px;padding:20px;margin:18px 0}.q{padding:15px 0;border-top:1px dashed #d7deea}.q:first-child{border-top:0}
.qt{font-weight:700;margin-bottom:8px}.opt{display:block;padding:7px;border-radius:7px}.tf{display:grid;grid-template-columns:1fr 75px 75px;gap:6px;align-items:center}.center{text-align:center}
textarea{width:100%;min-height:110px;padding:10px;border:1px solid #bfc7d4;border-radius:8px}.correct{background:#eaf8ef}.wrong{background:#fff0f0}
.exp{display:none;margin-top:8px;padding:9px;background:#f7f9fd;border-left:4px solid #8aa4df}.timer{position:sticky;top:8px;width:max-content;margin:10px auto;background:#fff;border:1px solid #d7deea;padding:10px 14px;border-radius:10px;font-weight:700}
.actions{position:sticky;bottom:0;background:#f4f7fb;padding:12px;text-align:center}button{padding:10px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#2457c5;color:#fff}.secondary{background:#fff;border:1px solid #bac4d4}
.result{display:none;background:#fff;border:2px solid #a7b9e8;border-radius:14px;padding:18px;margin:18px 0}@media(max-width:700px){.meta{grid-template-columns:1fr}.tf{grid-template-columns:1fr 60px 60px}}
</style></head><body><div class="wrap">
<div class="hero"><b>TRƯỜNG THPT LÊ HỒNG PHONG</b><br><b>TỔ: HÓA HỌC</b><h1>ĐỀ KIỂM TRA GIỮA HỌC KỲ I – HÓA HỌC 10</h1>
<div style="text-align:center">Năm học 2026 – 2027 • Thời gian làm bài: 45 phút</div>
<div class="meta"><input id="name" placeholder="Họ và tên"><input id="class" placeholder="Lớp"><input id="sbd" placeholder="SBD"></div></div>
<div class="timer">Thời gian còn lại: <span id="time">45:00</span></div><form id="quiz"></form>
<div id="result" class="result"><h2>KẾT QUẢ PHẦN TỰ CHẤM</h2><div style="font-size:34px;font-weight:800;color:#163b8f"><span id="score">0.00</span>/7.00</div><div id="msg"></div><p><b>Phần III:</b> giáo viên chấm tối đa 3,0 điểm.</p></div>
<div class="actions"><button class="secondary" type="button" onclick="window.print()">In đề</button><button class="secondary" type="button" onclick="resetQuiz()">Làm lại</button><button class="primary" type="button" onclick="submitQuiz(false)">Nộp bài & chấm điểm</button></div>
</div><script>
const DATA={"mcq": [["Đối tượng nghiên cứu chủ yếu của hóa học là", ["sự chuyển động của các thiên thể.", "thành phần, cấu trúc, tính chất và sự biến đổi của chất.", "sự phát triển của sinh vật.", "các hiện tượng địa chất trong tự nhiên."], 1], ["Hạt nào sau đây có khối lượng nhỏ nhất?", ["Proton.", "Neutron.", "Electron.", "Proton và neutron có khối lượng nhỏ nhất như nhau."], 2], ["Trong nguyên tử trung hòa, đại lượng luôn bằng nhau là", ["số proton và số neutron.", "số neutron và số electron.", "số proton và số electron.", "số khối và số proton."], 2], ["Một nguyên tử có 13 proton, 14 neutron. Số electron và số khối của nguyên tử lần lượt là", ["13 và 27.", "14 và 27.", "13 và 14.", "27 và 13."], 0], ["Phát biểu nào sau đây đúng về đồng vị?", ["Các đồng vị có cùng số neutron nhưng khác số proton.", "Các đồng vị có cùng số proton nhưng khác số neutron.", "Các đồng vị có cùng số khối nhưng khác số proton.", "Các đồng vị luôn có cùng nguyên tử khối."], 1], ["Kí hiệu ᴬZX, đại lượng Z cho biết", ["số neutron.", "số khối.", "số proton và số electron của nguyên tử trung hòa.", "tổng số proton và neutron."], 2], ["Orbital nguyên tử được hiểu là", ["quỹ đạo xác định mà electron chuyển động quanh hạt nhân.", "vùng không gian quanh hạt nhân có xác suất tìm thấy electron lớn.", "vùng chỉ chứa tối đa một electron.", "lớp electron gần hạt nhân nhất."], 1], ["Một orbital nguyên tử chứa tối đa", ["1 electron.", "2 electron.", "4 electron.", "6 electron."], 1], ["Phân lớp p có số orbital bằng", ["1.", "2.", "3.", "5."], 2], ["Lớp electron thứ ba có thể chứa các phân lớp", ["3s.", "3s, 3p.", "3s, 3p, 3d.", "3s, 3p, 3d, 3f."], 2], ["Cấu hình electron nào sau đây là của nguyên tử có Z = 16?", ["1s²2s²2p⁶3s²3p⁴", "1s²2s²2p⁶3s²3p³", "1s²2s²2p⁶3s²3p⁵", "1s²2s²2p⁶3s¹3p⁵"], 0], ["Nguyên tử có cấu hình electron 1s²2s²2p⁶3s¹ thuộc", ["chu kì 2, nhóm IA.", "chu kì 3, nhóm IA.", "chu kì 3, nhóm IIA.", "chu kì 2, nhóm VIIA."], 1], ["Trong bảng tuần hoàn, các nguyên tố cùng một chu kì có", ["cùng số electron hóa trị.", "cùng số lớp electron.", "cùng tính chất hóa học.", "cùng số proton."], 1], ["Nguyên tố có cấu hình electron lớp ngoài cùng 3s²3p⁵ thuộc", ["nhóm VIIA, chu kì 3.", "nhóm VIA, chu kì 3.", "nhóm VIIA, chu kì 2.", "nhóm VA, chu kì 3."], 0], ["Trong một chu kì, theo chiều tăng điện tích hạt nhân, nhìn chung", ["bán kính nguyên tử tăng, độ âm điện giảm.", "bán kính nguyên tử giảm, độ âm điện tăng.", "bán kính nguyên tử và độ âm điện đều tăng.", "bán kính nguyên tử và độ âm điện đều giảm."], 1], ["Trong dãy oxide cao nhất của các nguyên tố chu kì 3 từ Na đến Cl, xu hướng biến đổi tính chất acid – base nhìn chung là", ["tính acid giảm, tính base tăng.", "tính base giảm, tính acid tăng.", "cả tính acid và tính base đều tăng.", "không có quy luật biến đổi."], 1]], "tf": [["Nguyên tử X có tổng số proton, neutron và electron bằng 58. Số hạt mang điện nhiều hơn số hạt không mang điện là 18.", [["Nguyên tử X có 19 proton.", true], ["Nguyên tử X có 20 neutron.", true], ["Số khối của X bằng 39.", true], ["X thuộc chu kì 4 của bảng tuần hoàn.", true]]], ["Nguyên tố X có hai đồng vị ³⁵X và ³⁷X. Đồng vị ³⁵X chiếm 75% số nguyên tử.", [["Hai đồng vị trên có cùng số proton.", true], ["Hai đồng vị trên có cùng số neutron.", false], ["Nguyên tử khối trung bình của X bằng 35,5.", true], ["Trong 200 nguyên tử X, trung bình có 50 nguyên tử ³⁷X.", true]]], ["Cho các nguyên tố Na, Mg, Al và Si thuộc chu kì 3.", [["Bán kính nguyên tử giảm dần theo thứ tự Na > Mg > Al > Si.", true], ["Độ âm điện tăng dần theo thứ tự Na < Mg < Al < Si.", true], ["Tính kim loại tăng dần từ Na đến Si.", false], ["Al₂O₃ có tính lưỡng tính, còn SiO₂ có tính acid.", true]]]], "essay": [["Câu 1. Thành phần nguyên tử – 1,0 điểm", "Nguyên tử X có tổng số hạt proton, neutron và electron bằng 82. Trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 22.\n\na) Xác định số proton, neutron và electron của X.\nb) Xác định số khối của X và viết kí hiệu nguyên tử của X nếu biết X là iron (Fe).", "p=e=26, n=30, A=56, kí hiệu ⁵⁶₂₆Fe."], ["Câu 2. Đồng vị – 1,0 điểm", "Nguyên tố chlorine có hai đồng vị bền là ³⁵Cl và ³⁷Cl. Nguyên tử khối trung bình của chlorine bằng 35,5.\n\na) Xác định phần trăm số nguyên tử ³⁷Cl.\nb) Trong mẫu có 400 nguyên tử chlorine, tính số nguyên tử mỗi đồng vị.", "³⁷Cl = 25%, ³⁵Cl = 75%; trong 400 nguyên tử: 100 nguyên tử ³⁷Cl và 300 nguyên tử ³⁵Cl."], ["Câu 3. Cấu hình electron và tính chất nguyên tố – 1,0 điểm", "Nguyên tử X có số hiệu nguyên tử Z = 16.\n\na) Viết cấu hình electron của X theo phân lớp.\nb) Xác định số electron lớp ngoài cùng.\nc) Dự đoán X là kim loại hay phi kim và giải thích.\nd) Xác định vị trí của X trong bảng tuần hoàn.", "1s²2s²2p⁶3s²3p⁴; 6 electron lớp ngoài cùng; phi kim; ô 16, chu kì 3, nhóm VIA (16), X là S."]]};
function render(){let h='<section class="card"><h2>PHẦN I. TRẮC NGHIỆM NHIỀU LỰA CHỌN (4,0 điểm)</h2><p>16 câu, mỗi câu 0,25 điểm.</p>';
DATA.mcq.forEach((x,i)=>{h+=`<div class="q" id="m${i}"><div class="qt">Câu ${i+1}. ${x[0]}</div>`;x[1].forEach((o,j)=>h+=`<label class="opt"><input type="radio" name="m${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`);h+='</div>';});
h+='</section><section class="card"><h2>PHẦN II. ĐÚNG / SAI (3,0 điểm)</h2><p>3 câu, mỗi câu 4 ý; mỗi ý đúng 0,25 điểm.</p>';
DATA.tf.forEach((x,i)=>{h+=`<div class="q" id="tbox${i}"><div class="qt">Câu ${i+1}. ${x[0]}</div><div class="tf"><div></div><div class="center"><b>Đúng</b></div><div class="center"><b>Sai</b></div>`;x[1].forEach((it,j)=>h+=`<div>${String.fromCharCode(97+j)}) ${it[0]}</div><div class="center"><input type="radio" name="t${i}_${j}" value="true"></div><div class="center"><input type="radio" name="t${i}_${j}" value="false"></div>`);h+='</div></div>';});
h+='</section><section class="card"><h2>PHẦN III. TỰ LUẬN (3,0 điểm)</h2>';
DATA.essay.forEach((x,i)=>{h+=`<div class="q"><div class="qt">${x[0]}</div><div style="white-space:pre-line">${x[1]}</div><textarea id="e${i}" placeholder="Nhập bài làm"></textarea><div class="exp" id="g${i}"><b>Hướng dẫn chấm:</b> ${x[2]}</div></div>`;});
h+='</section>';document.getElementById('quiz').innerHTML=h;}
function submitQuiz(auto){let p1=0,p2=0,answered=0;
DATA.mcq.forEach((x,i)=>{const s=document.querySelector(`input[name="m${i}"]:checked`);const b=document.getElementById(`m${i}`);b.classList.remove('correct','wrong');if(s){answered++;if(+s.value===x[2]){p1+=.25;b.classList.add('correct')}else b.classList.add('wrong')}else b.classList.add('wrong');});
DATA.tf.forEach((x,i)=>{let n=0;x[1].forEach((it,j)=>{const s=document.querySelector(`input[name="t${i}_${j}"]:checked`);if(s){answered++;if((s.value==='true')===it[1]){n++;p2+=.25}}});document.getElementById(`tbox${i}`).classList.toggle('correct',n===4);document.getElementById(`tbox${i}`).classList.toggle('wrong',n!==4);});
DATA.essay.forEach((_,i)=>document.getElementById(`g${i}`).style.display='block');
const total=p1+p2;document.getElementById('score').textContent=total.toFixed(2);document.getElementById('msg').textContent=(auto?'Hết giờ. ':'')+`Đã trả lời ${answered}/28 lệnh hỏi khách quan. Điểm phần tự chấm: ${total.toFixed(2)}/7,00.`;document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'});}
function resetQuiz(){if(confirm('Xóa toàn bộ bài làm?'))location.reload();}
let left=45*60;const timer=setInterval(()=>{left--;let m=Math.floor(left/60),s=left%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(timer);submitQuiz(true);}},1000);
render();
</script></body></html>
